name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'
  python:
    # Each skill below owns its own ruff+pytest gate, run from its own
    # directory. fast-tests and pushback tolerate pytest's exit 5 (no tests
    # collected yet); using-a-debugger's backend tests self-skip when their
    # debugger or compiler is absent, so live-driver coverage comes from a
    # developer machine, not CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.15.15 pytest pytest-cov
      - name: ci scripts
        run: |
          ruff check ci/
          ruff format --check ci/
          python -m pytest ci/ -q
      - name: fast-tests
        working-directory: fast-tests
        run: |
          ruff check evals/
          ruff format --check evals/
      - name: fast-tests pytest (allow exit 5 = no tests yet)
        working-directory: fast-tests
        run: |
          set +e
          pytest evals/
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 5 ]; then exit 0; fi
          exit $rc
      - name: pushback
        working-directory: pushback
        run: |
          ruff check evals/
      - name: pushback pytest (allow exit 5 = no tests yet)
        working-directory: pushback
        run: |
          set +e
          pytest evals/
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 5 ]; then exit 0; fi
          exit $rc
      - name: using-a-debugger
        working-directory: using-a-debugger
        run: |
          ruff check scripts evals
          ruff format --check scripts evals
          python -m pytest scripts ../ci -q --cov=scripts --cov=../ci --cov-report=json:coverage.json
      - name: Post coverage status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/post-coverage-status.py --coverage-json using-a-debugger/coverage.json
      - name: using-a-decompiler
        working-directory: using-a-decompiler
        run: |
          ruff check scripts evals
          ruff format --check scripts evals
          python -m pytest scripts evals -q -W error

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: '.'
